<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerBlogsVerse - Iniciar Sesión</title>
    <!-- Importar Firebase App y Auth SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(11, 12, 16, 0.8), rgba(11, 12, 16, 0.8)), 
                        url('fondo-gamer.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #c5c6c7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .login-container {
            background-color: rgba(18, 20, 28, 0.9);
            backdrop-filter: blur(5px);
            border: 1px solid #1f2430;
            border-radius: 8px;
            padding: 30px 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .logo {
            font-size: clamp(20px, 5vw, 26px);
            font-weight: 900;
            color: #090a0f;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-style: italic;
            -webkit-text-stroke: 1.5px #ff007f;
            text-shadow: 
                0 0 2px #ff007f,
                0 0 8px #00f0ff,
                0 0 16px #00f0ff;
            margin-bottom: 10px;
            user-select: none;
            word-break: break-word;
        }

        .login-subtitle {
            font-size: clamp(10px, 3vw, 12px);
            color: #8a8f9e;
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .btn-social {
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .btn-google {
            background-color: #ffffff;
            color: #12141c;
        }

        .btn-google:hover {
            background-color: #00f0ff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        .btn-github {
            background-color: #24292e;
            color: #ffffff;
            border: 1px solid #3f4448;
        }

        .btn-github:hover {
            background-color: #ff007f;
            border-color: #ff007f;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.4);
        }

        #toastContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 2000;
            pointer-events: none;
        }

        .toast {
            background-color: #ff007f;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.6);
            margin-top: 5px;
            pointer-events: auto;
            max-width: 100%;
        }

        /* Ajustes para pantallas pequeñas */
        @media (max-width: 480px) {
            .login-container {
                padding: 25px 18px;
            }

            .btn-social {
                font-size: 12px;
                padding: 10px;
            }

            #toastContainer {
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">GamerBlogsVerse</div>
        <div class="login-subtitle">Accede con tu cuenta oficial</div>
        
        <button class="btn-social btn-google" onclick="loginConGoogle()">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#12141c" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.1 8.9 5 12 5z"/><path fill="#12141c" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#12141c" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.6 7.2C.6 9.2 0 11.5 0 14s.6 4.8 1.6 6.8l3.7-2.9z"/><path fill="#12141c" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5.1L1.6 16C3.5 19.8 7.4 23 12 23z"/></svg>
            Continuar con Google
        </button>

        <button class="btn-social btn-github" onclick="loginConGithub()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            Continuar con GitHub
        </button>
    </div>

    <div id="toastContainer"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAn3OccYdLdKnaOU3MKCbxx0gw5oS1is7w",
            authDomain: "gamerblogverse.firebaseapp.com",
            projectId: "gamerblogverse",
            storageBucket: "gamerblogverse.firebasestorage.app",
            messagingSenderId: "407420759929",
            appId: "1:407420759929:web:85554efffdd87f786c09a8"
        };

        firebase.initializeApp(firebaseConfig);

        function mostrarToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function loginConGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider)
                .then((result) => {
                    const user = result.user;
                    localStorage.setItem('usuarioActivoNombre', user.displayName || 'Gamer Google');
                    mostrarToast("¡Autenticación exitosa! Redirigiendo...");
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);
                })
                .catch((error) => {
                    console.error("Error en el login:", error.message);
                    mostrarToast("Error al iniciar sesión con Google.");
                });
        }

        function loginConGithub() {
            const provider = new firebase.auth.GithubAuthProvider();
            firebase.auth().signInWithPopup(provider)
                .then((result) => {
                    const user = result.user;
                    localStorage.setItem('usuarioActivoNombre', user.displayName || user.email || 'Gamer GitHub');
                    mostrarToast("¡Autenticación exitosa! Redirigiendo...");
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);
                })
                .catch((error) => {
                    console.error("Error en el login:", error.message);
                    mostrarToast("Error al iniciar sesión con GitHub.");
                });
        }
    </script>
</body>
</html>
