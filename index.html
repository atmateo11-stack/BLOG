<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerBlogsVerse - Iniciar Sesión</title>
    <!-- Importar Firebase App y Auth SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .login-container {
            background-color: #12141c;
            border: 1px solid #1f2430;
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: #090a0f;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-style: italic;
            -webkit-text-stroke: 1.5px #ff007f;
            text-shadow: 
                0 0 2px #ff007f,
                0 0 8px #00f0ff,
                0 0 16px #00f0ff;
            margin-bottom: 10px;
            user-select: none;
        }

        .login-subtitle {
            font-size: 12px;
            color: #8a8f9e;
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .btn-google {
            background-color: #ffffff;
            color: #12141c;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
        }

        .btn-google:hover {
            background-color: #00f0ff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        #toastContainer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
        }

        .toast {
            background-color: #ff007f;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.6);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">GamerBlogsVerse</div>
        <div class="login-subtitle">Accede con tu cuenta oficial</div>
        
        <!-- Botón de Inicio de Sesión con Google -->
        <button class="btn-google" onclick="loginConGoogle()">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#12141c" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.1 8.9 5 12 5z"/><path fill="#12141c" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#12141c" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.6 7.2C.6 9.2 0 11.5 0 14s.6 4.8 1.6 6.8l3.7-2.9z"/><path fill="#12141c" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5.1L1.6 16C3.5 19.8 7.4 23 12 23z"/></svg>
            Continuar con Google
        </button>
    </div>

    <div id="toastContainer"></div>

    <script>
        // CONFIGURACIÓN DE FIREBASE (Reemplaza con tus credenciales de la consola de Firebase)
        const firebaseConfig = {
            apiKey: "AIzaSyAn3OccYdLdKnaOU3MKCbxx0gw5oS1is7w",
            authDomain: "gamerblogverse.firebaseapp.com",
            projectId: "gamerblogverse",
            storageBucket: "gamerblogverse.firebasestorage.app",
            messagingSenderId: "407420759929",
            appId: "1:407420759929:web:85554efffdd87f786c09a8"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);

        function mostrarToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Función para autenticar con Google
        function loginConGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider)
                .then((result) => {
                    const user = result.user;
                    // Guardar nombre del usuario autenticado en localStorage
                    localStorage.setItem('usuarioActivoNombre', user.displayName || 'Gamer Google');
                    mostrarToast("¡Autenticación exitosa! Redirigindo...");
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1000);
                })
                .catch((error) => {
                    console.error("Error en el login:", error.message);
                    mostrarToast("Error al iniciar sesión con Google.");
                });
        }
    </script>
</body>
</html>
