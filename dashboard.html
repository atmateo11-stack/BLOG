<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerBlogsVerse - Panel Principal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(11, 12, 16, 0.85), rgba(11, 12, 16, 0.85)), 
                        url('fondo-gamer.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #c5c6c7;
            min-height: 100vh;
            padding: 15px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(18, 20, 28, 0.9);
            backdrop-filter: blur(5px);
            border: 1px solid #1f2430;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            font-size: clamp(18px, 4vw, 22px);
            font-weight: 900;
            color: #090a0f;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-style: italic;
            -webkit-text-stroke: 1.5px #ff007f;
            text-shadow: 
                0 0 2px #ff007f,
                0 0 8px #00f0ff,
                0 0 16px #00f0ff;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        #welcomeUser {
            font-size: clamp(12px, 3vw, 14px);
            font-weight: 600;
            color: #00f0ff;
        }

        .btn-logout {
            background-color: transparent;
            color: #ff007f;
            border: 1px solid #ff007f;
            padding: 8px 14px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-logout:hover {
            background-color: #ff007f;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h2 {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: clamp(16px, 4vw, 20px);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-left: 4px solid #00f0ff;
            padding-left: 10px;
        }

        /* Responsive Grid: Se ajusta automáticamente desde 1 hasta N columnas según la pantalla */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .news-card {
            background-color: rgba(18, 20, 28, 0.9);
            backdrop-filter: blur(5px);
            border: 1px solid #1f2430;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .news-card:hover {
            transform: translateY(-3px);
            border-color: #00f0ff;
        }

        .news-title {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .news-desc {
            font-size: 13px;
            color: #8a8f9e;
            margin-bottom: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        .news-link {
            display: inline-block;
            align-self: flex-start;
            background-color: #00f0ff;
            color: #12141c;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .news-link:hover {
            background-color: #ff007f;
            color: #ffffff;
        }

        /* Ajustes específicos para smartphones */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                padding: 15px;
            }

            .user-info {
                width: 100%;
                justify-content: space-between;
            }

            .news-grid {
                grid-template-columns: 1fr;
            }

            .news-card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">GamerBlogsVerse</div>
        <div class="user-info">
            <span id="welcomeUser">Cargando usuario...</span>
            <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </header>

    <div class="main-container">
        <h2>Noticias eSports & Gaming en Vivo</h2>
        <div class="news-grid" id="newsContainer">
            <div class="news-card">
                <div>
                    <div class="news-title">Cargando feeds en tiempo real...</div>
                    <div class="news-desc">Conectando con PlayStation, Steam y PC Gamer.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const nombreUsuario = localStorage.getItem('usuarioActivoNombre') || 'Gamer';
        document.getElementById('welcomeUser').textContent = `Hola, ${nombreUsuario}`;

        function cerrarSesion() {
            localStorage.removeItem('usuarioActivoNombre');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
